<script type="text/javascript">
(function () {
	'use strict';

	// ---------------------------------------------------------------------------
	// Constants
	// ---------------------------------------------------------------------------

	var URL_REDIRECTS = {
		'structtgen_1_1__detail_1_1gen__base.html': 'group__generator__op.html'
	};

	var CPP_PRIMITIVES = new Set([
		'int', 'long', 'short', 'char', 'float', 'double', 'bool', 'void',
		'size_t', 'ptrdiff_t',
		'uint8_t', 'uint16_t', 'uint32_t', 'uint64_t',
		'int8_t', 'int16_t', 'int32_t', 'int64_t',
		'auto'
	]);

	var CPP_KEYWORDS = new Set([
		'#define',
		'const', 'constexpr', 'static', 'volatile', 'mutable',
		'typename', 'class', 'struct', 'signed', 'unsigned', 'using'
	]);

	// Lowercase / snake_case tgen API names (not matched by PascalCase rules).
	var TGEN_TYPES = new Set([
		'list', 'str', 'pair', 'permutation',
		'graph', 'tree', 'wgraph', 'wtree', 'vgraph', 'egraph', 'vtree', 'etree',
		'print', 'println', 'distinct', 'opt',
		'is_generator_value',
		'gen_base', 'gen_value_base'
	]);

	var HIGHLIGHT_TYPE_SPLIT_RE =
		/(\s+|#[A-Za-z_]\w*|::|->\*|->|<=|>=|==|!=|&&|\|\||<<|>>|[()<>*&,:~#])/g;

	var STL_TYPES_RE =
		/^(ostream|vector|array|pair|tuple|optional|string|map|set|unordered_map|unordered_set)$/;

	var STL_TYPES_EXTENDED_RE =
		/^(ostream|vector|array|pair|tuple|optional|string|map|set|unordered_map|unordered_set|unique_ptr|shared_ptr|deque|list)$/;

	var MEMITEMRIGHT_HIGHLIGHT_ANCESTOR =
		'span.keywordtype, span.keyword, span.type, span.namespace, span.paramname, span.paramdefval';

	var MEMPROTO_MEMNAME_ROW =
		'.memproto table.memname > tbody > tr:first-child > td.memname';

	var MEMPROTO_FIRST_ROW_LAST_TD =
		'.memproto table.memname > tbody > tr:first-child > td:last-child';

	// Doxygen already styled these; do not re-tokenize their text (markdown ```cpp``` lines).
	var FRAGMENT_SKIP_SPAN_SELECTOR =
		'span.comment, span.stringliteral, span.charliteral, span.preprocessor, span.keyword, span.keywordtype, span.keywordflow';

	// ---------------------------------------------------------------------------
	// Small utilities
	// ---------------------------------------------------------------------------

	function isInNavTree(node) {
		return Boolean(node && node.closest && node.closest('#nav-tree'));
	}

	function docContent() {
		return document.getElementById('doc-content');
	}

	// ---------------------------------------------------------------------------
	// Member declaration tables: fixed left column width
	// ---------------------------------------------------------------------------

	function applyMemberDeclColumnWidths() {
		document.querySelectorAll('table.memberdecls').forEach(function (table) {
			table.style.width = '100%';
			table.style.tableLayout = 'fixed';
			var colgroup = document.createElement('colgroup');
			var c0 = document.createElement('col');
			var c1 = document.createElement('col');
			c0.style.width = '340px';
			c1.style.width = '';
			colgroup.appendChild(c0);
			colgroup.appendChild(c1);
			table.insertBefore(colgroup, table.firstChild);
		});
	}

	// ---------------------------------------------------------------------------
	// Memproto first row: split "return type" vs "function / macro name"
	// ---------------------------------------------------------------------------

	function rhsLooksLikeFunctionName(str) {
		str = str.trim();
		if (!str) return false;
		if (str.indexOf('::') !== -1) return true;
		if (/^operator[^\s]*$/.test(str)) return true;
		if (/^[~A-Za-z_]\w*\s*\(/.test(str)) return true;
		return false;
	}

	function transformMemprotoMemnameCell(el) {
		if (el.querySelector('.tgen-return')) return;

		var nodes = Array.from(el.childNodes).filter(function (n) {
			return n.nodeType === Node.TEXT_NODE ||
				(n.nodeType === Node.ELEMENT_NODE && n.tagName === 'A');
		});
		if (!nodes.length) return;

		var raw = nodes.map(function (n) { return n.textContent; }).join('').trimStart();

		if (raw.indexOf('#define') === 0) {
			var retSpan = document.createElement('span');
			retSpan.className = 'tgen-return';
			retSpan.textContent = '#define';
			var nameSpan = document.createElement('span');
			nameSpan.className = 'tgen-name';
			var after = raw.slice(7).trimStart();
			var m = after.match(/^([A-Za-z_]\w*)/);
			nameSpan.textContent = m ? m[1] : after;
			el.innerHTML = '';
			el.appendChild(retSpan);
			el.appendChild(document.createTextNode(' '));
			el.appendChild(nameSpan);
			return;
		}

		var splitNodeIndex = -1;
		var splitOffset = -1;
		var templateDepth = 0;
		var i;
		var j;
		var k;
		var text;
		var c;
		var rhs;

		for (i = nodes.length - 1; i >= 0; --i) {
			text = nodes[i].textContent;
			for (j = text.length - 1; j >= 0; --j) {
				c = text[j];
				if (c === '>') templateDepth++;
				else if (c === '<') templateDepth--;
				if (templateDepth === 0 && c === ' ') {
					rhs = text.slice(j + 1);
					for (k = i + 1; k < nodes.length; ++k) rhs += nodes[k].textContent;
					if (rhsLooksLikeFunctionName(rhs)) {
						splitNodeIndex = i;
						splitOffset = j;
						break;
					}
				}
			}
			if (splitNodeIndex !== -1) break;
		}

		if (splitNodeIndex === -1) {
			var full = nodes.map(function (n) { return n.textContent; }).join('');
			var opPos = full.lastIndexOf('operator');
			if (opPos !== -1) {
				var beforeChar = opPos > 0 ? full[opPos - 1] : ' ';
				if (/\s/.test(beforeChar)) {
					var spacePos = full.lastIndexOf(' ', opPos - 1);
					if (spacePos === -1) spacePos = 0;
					var cum = 0;
					var foundNode = -1;
					var foundOffset = -1;
					for (i = 0; i < nodes.length; ++i) {
						var len = nodes[i].textContent.length;
						if (spacePos < cum + len) {
							foundNode = i;
							foundOffset = spacePos - cum;
							break;
						}
						cum += len;
					}
					if (foundNode === -1) {
						splitNodeIndex = nodes.length - 2;
						splitOffset = nodes[splitNodeIndex].textContent.length - 1;
					} else if (foundOffset === 0) {
						splitNodeIndex = foundNode - 1;
						splitOffset = splitNodeIndex >= 0
							? nodes[splitNodeIndex].textContent.length - 1
							: -1;
					} else {
						splitNodeIndex = foundNode;
						splitOffset = foundOffset;
					}
				}
			}
		}

		if (splitNodeIndex === -1) {
			var onlyName = document.createElement('span');
			onlyName.className = 'tgen-name';
			nodes.forEach(function (n) { onlyName.appendChild(n.cloneNode(true)); });
			el.innerHTML = '';
			el.appendChild(onlyName);
			return;
		}

		var ret = document.createElement('span');
		ret.className = 'tgen-return';
		var name = document.createElement('span');
		name.className = 'tgen-name';

		for (i = 0; i < nodes.length; ++i) {
			var node = nodes[i];
			var clone = node.cloneNode(true);
			if (i < splitNodeIndex) {
				ret.appendChild(clone);
			} else if (i > splitNodeIndex) {
				name.appendChild(clone);
			} else if (node.nodeType === Node.TEXT_NODE && splitOffset >= 0) {
				var left = node.textContent.slice(0, splitOffset);
				var right = node.textContent.slice(splitOffset + 1);
				if (left) ret.appendChild(document.createTextNode(left));
				if (right) name.appendChild(document.createTextNode(right));
			} else {
				name.appendChild(clone);
			}
		}

		el.innerHTML = '';
		el.appendChild(ret);
		el.appendChild(name);
	}

	function applyMemprotoReturnNameSplit() {
		document.querySelectorAll(MEMPROTO_MEMNAME_ROW).forEach(transformMemprotoMemnameCell);
	}

	// ---------------------------------------------------------------------------
	// Syntax highlight: .tgen-return, .paramtype, trailing cv / noexcept cell,
	// and plain text inside markdown fenced blocks (div.fragment > div.line).
	// ---------------------------------------------------------------------------

	function highlightCppTokensInSubtree(root, opts) {
		opts = opts || {};
		var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
		var textNodes = [];
		while (walker.nextNode()) textNodes.push(walker.currentNode);

		textNodes.forEach(function (textNode) {
			var parent = textNode.parentElement;
			if (!parent || isInNavTree(parent)) return;
			if (opts.fragmentLine) {
				if (parent.closest && parent.closest('a')) return;
				if (parent.closest && parent.closest(FRAGMENT_SKIP_SPAN_SELECTOR)) return;
			} else if (parent.closest('a.el')) return;

			var text = textNode.nodeValue;
			if (!text || !text.trim()) return;
			if (parent.closest && parent.closest('.tgen-hl')) return;

			var frag = document.createDocumentFragment();
			var parts = text.split(HIGHLIGHT_TYPE_SPLIT_RE).filter(function (t) {
				return t !== undefined && t !== '';
			});

			parts.forEach(function (tok) {
				if (/^\s+$/.test(tok) || /^[:<>,()=*&]$/.test(tok) || tok === '::') {
					frag.appendChild(document.createTextNode(tok));
					return;
				}

				var cls = null;
				if (CPP_PRIMITIVES.has(tok)) cls = 'primitive';
				else if (CPP_KEYWORDS.has(tok)) cls = 'keyword';
				else if (tok === 'std' || tok === 'tgen' || tok === 'detail') cls = 'namespace';
				else if (/^[A-Z]\w*$/.test(tok)) cls = 'type';
				else if (TGEN_TYPES.has(tok) || tok === 'value') cls = 'type';
				else if (STL_TYPES_EXTENDED_RE.test(tok)) cls = 'type';
				else if (/^[A-Za-z_]\w*$/.test(tok) && /[A-Z]/.test(tok.slice(1))) cls = 'type';

				if (cls) {
					var span = document.createElement('span');
					span.className = 'tgen-hl ' + cls;
					span.textContent = tok;
					frag.appendChild(span);
				} else {
					frag.appendChild(document.createTextNode(tok));
				}
			});

			textNode.parentNode.replaceChild(frag, textNode);
		});
	}

	function applyTgenCppHighlights() {
		document.querySelectorAll('.tgen-return').forEach(function (el) {
			highlightCppTokensInSubtree(el);
		});
		document.querySelectorAll('.paramtype').forEach(function (el) {
			highlightCppTokensInSubtree(el);
		});
		document.querySelectorAll(MEMPROTO_FIRST_ROW_LAST_TD).forEach(function (el) {
			highlightCppTokensInSubtree(el);
		});
	}

	// Markdown ```cpp``` → div.fragment > div.line; Doxygen leaves std::vector, etc. unstyled.
	function applyFragmentCppTokenHighlights() {
		var root = docContent();
		if (!root) return;
		root.querySelectorAll('div.fragment > div.line').forEach(function (line) {
			highlightCppTokensInSubtree(line, { fragmentLine: true });
		});
	}

	// ---------------------------------------------------------------------------
	// Function list: return type column (memItemLeft)
	// ---------------------------------------------------------------------------

	function tokenizeMemItemLeft(str) {
		return str.split(/(#[A-Za-z_]\w*|::|<|>|,|&|\*|\s+|\b)/);
	}

	function classifyMemItemLeftToken(tok) {
		if (/^(auto|void|bool|char|int|short|long|float|double|size_t|u?int\d+_t)$/.test(tok))
			return 'keywordtype';
		if (/^[A-Z]\w*$/.test(tok)) return 'type';
		if (TGEN_TYPES.has(tok) || tok === 'value') return 'type';
		if (STL_TYPES_RE.test(tok)) return 'type';
		if (/^(#define|struct|const|constexpr|static|inline|volatile|mutable|noexcept|using)$/.test(tok))
			return 'keyword';
		if (tok === 'std' || tok === 'tgen' || tok === 'detail') return 'namespace';
		return null;
	}

	function highlightMemItemLeft(td) {
		var walker = document.createTreeWalker(td, NodeFilter.SHOW_TEXT);
		var node;
		while ((node = walker.nextNode())) {
			if (node.parentElement.closest('a')) continue;
			var tokens = tokenizeMemItemLeft(node.nodeValue);
			if (tokens.length === 1) continue;

			var frag = document.createDocumentFragment();
			tokens.forEach(function (tok) {
				var cls = classifyMemItemLeftToken(tok);
				if (!cls) frag.appendChild(document.createTextNode(tok));
				else {
					var span = document.createElement('span');
					span.className = cls;
					span.textContent = tok;
					frag.appendChild(span);
				}
			});
			node.parentNode.replaceChild(frag, node);
		}
	}

	function highlightAllMemItemLeft() {
		document.querySelectorAll('td.memItemLeft').forEach(highlightMemItemLeft);
	}

	// ---------------------------------------------------------------------------
	// Function list: signature column (memItemRight)
	// ---------------------------------------------------------------------------

	function tokenizeMemItemRight(str) {
		return str.split(/(\b|::|<|>|,|\(|\)|=|&|\*|\s+)/);
	}

	function classifyMemItemRightToken(tok, state) {
		if (tok === '=') {
			state.inDefault = true;
			return null;
		}
		if (tok === ',' || tok === ')') {
			state.inDefault = false;
			return null;
		}
		if (tok === 'std' || tok === 'tgen' || tok === 'detail') return 'namespace';

		if (state.inDefault) {
			if (/^(true|false|nullptr)$/.test(tok)) return 'paramdefval';
			if (/^\d+(\.\d+)?$/.test(tok)) return 'paramdefval';
			return 'paramdefval';
		}

		if (/^(const|constexpr|static|inline|volatile|mutable|noexcept|using)$/.test(tok)) return 'keyword';
		if (/^(void|bool|char|int|short|long|float|double|size_t|u?int\d+_t)$/.test(tok))
			return 'keywordtype';
		if (/^[A-Z]\w*$/.test(tok)) return 'type';
		if (TGEN_TYPES.has(tok) || tok === 'value') return 'type';
		if (STL_TYPES_RE.test(tok)) return 'type';
		if (/^[a-zA-Z_]\w*$/.test(tok)) return 'paramname';
		return null;
	}

	function highlightMemItemRight(td) {
		var walker = document.createTreeWalker(td, NodeFilter.SHOW_TEXT);
		var collected = [];
		var n;
		while ((n = walker.nextNode())) collected.push(n);

		collected.forEach(function (textNode) {
			var raw = textNode.nodeValue;
			if (!raw || !raw.trim()) return;

			var pe = textNode.parentElement;
			if (!pe) return;
			if (pe.closest('a.el')) return;
			if (pe.closest(MEMITEMRIGHT_HIGHLIGHT_ANCESTOR)) return;

			var tokens = tokenizeMemItemRight(raw);
			var frag = document.createDocumentFragment();
			var state = { inDefault: false };
			tokens.forEach(function (tok) {
				var cls = classifyMemItemRightToken(tok, state);
				if (!cls) frag.appendChild(document.createTextNode(tok));
				else {
					var span = document.createElement('span');
					span.className = cls;
					span.textContent = tok;
					frag.appendChild(span);
				}
			});
			textNode.parentNode.replaceChild(frag, textNode);
		});
	}

	function highlightAllMemItemRight() {
		document.querySelectorAll('td.memItemRight').forEach(highlightMemItemRight);
	}

	// ---------------------------------------------------------------------------
	// After load: strip selected links, keep colours via span classes
	// ---------------------------------------------------------------------------

	function classifySignatureIdentifier(tok) {
		var t = tok.trim();
		if (!t) return 'paramname';

		if (t.indexOf('::') !== -1) {
			var parts = t.split('::').filter(Boolean);
			if (
				parts.length &&
				parts.every(function (p) {
					var c = classifySignatureIdentifier(p);
					return c === 'type' || c === 'namespace';
				})
			)
				return 'type';
		}

		if (/^(const|constexpr|static|inline|volatile|mutable|noexcept|typename|class|struct|signed|unsigned|using)$/.test(t))
			return 'keyword';
		if (/^(void|bool|char|int|short|long|float|double|size_t|u?int\d+_t)$/.test(t)) return 'keywordtype';
		if (/^[A-Z]\w*$/.test(t)) return 'type';
		if (TGEN_TYPES.has(t) || t === 'value') return 'type';
		if (STL_TYPES_RE.test(t)) return 'type';
		if (t === 'std' || t === 'tgen' || t === 'detail') return 'namespace';
		if (/^[A-Za-z_]\w*$/.test(t) && /[A-Z]/.test(t.slice(1))) return 'type';
		return 'paramname';
	}

	function unlinkTgenNameLinks(root) {
		root.querySelectorAll('.tgen-name a').forEach(function (link) {
			if (link.closest('#nav-tree')) return;
			link.replaceWith(document.createTextNode(link.textContent));
		});
	}

	function unlinkSignatureParamLinks(root) {
		root.querySelectorAll('td.memItemRight a.el').forEach(function (link) {
			if (link.closest('#nav-tree')) return;
			var td = link.closest('td.memItemRight');
			if (!td) return;
			var firstLink = td.querySelector('a.el');
			if (link === firstLink) return;
			var span = document.createElement('span');
			span.className = classifySignatureIdentifier(link.textContent);
			span.textContent = link.textContent;
			link.replaceWith(span);
		});
	}

	function observeDocContentForNameUnlink(docRoot) {
		new MutationObserver(function (mutations) {
			mutations.forEach(function (m) {
				m.addedNodes.forEach(function (node) {
					if (node.nodeType === 1 && !isInNavTree(node)) unlinkTgenNameLinks(node);
				});
			});
		}).observe(docRoot, { childList: true, subtree: true });
	}

	function registerPostLoadLinkStripping(docRoot) {
		window.addEventListener('load', function () {
			unlinkTgenNameLinks(docRoot);
			unlinkSignatureParamLinks(docRoot);
		});
		observeDocContentForNameUnlink(docRoot);
	}

	// ---------------------------------------------------------------------------
	// Rewrite a.el hrefs for merged / moved pages
	// ---------------------------------------------------------------------------

	function applyDocLinkRedirects(root) {
		root.querySelectorAll('a.el').forEach(function (a) {
			var href = a.getAttribute('href');
			if (!href) return;
			var page = href.split('#')[0];
			if (!Object.prototype.hasOwnProperty.call(URL_REDIRECTS, page)) return;
			var anchor = href.indexOf('#') !== -1 ? '#' + href.split('#')[1] : '';
			a.href = URL_REDIRECTS[page] + anchor;
		});
	}

	// ---------------------------------------------------------------------------
	// Memproto: drop empty parameter placeholder cells
	// ---------------------------------------------------------------------------

	function removeEmptyParameterCells() {
		document.querySelectorAll('table.memname tr').forEach(function (tr) {
			var typeTd = tr.querySelector('td.paramtype');
			var nameTd = tr.querySelector('td.paramname');
			if (!typeTd && !nameTd) return;

			function empty(td) {
				return !td || td.textContent.trim() === '';
			}

			if (empty(typeTd) && empty(nameTd)) {
				if (typeTd) typeTd.remove();
				if (nameTd) nameTd.remove();
				var prev = tr.querySelector('td:nth-last-child(3)');
				if (prev && prev.textContent.trim() === ',') prev.remove();
			}
		});
	}

	// ---------------------------------------------------------------------------
	// Title row: badges + GitHub control
	// ---------------------------------------------------------------------------

	function injectProjectHeader() {
		var name = document.getElementById('projectname');
		if (!name) return;
		name.innerHTML = `
	  <div class="top-buttons">
		  <img src="https://img.shields.io/github/actions/workflow/status/brunomaletta/tgen/ci.yml?label=tests" height="20">
		  <div id="github-button">
			  <a href="https://github.com/brunomaletta/tgen" target="_blank" aria-label="GitHub repository">

	// ---------------------------------------------------------------------------
	// Nav tree: expand nodes when their label link is clicked, and expand the
	// selected node after navigation (Doxygen only auto-expands it on index/pages).
	// ---------------------------------------------------------------------------

	var navTreeExpandTimer = null;
	var navTreeUserCollapsedSelected = false;
	var navTreeAutoExpandKey = '';

	function selectedNavTreeKey(selected) {
		if (!selected) return '';
		var link = selected.querySelector('.label a');
		var href = link ? (link.getAttribute('href') || '') : '';
		var cls = link ? (link.className || '') : '';
		return location.pathname + location.hash + '|' + cls + '|' + href;
	}

	function navTreeExpandToggle(item) {
		if (!item) return null;
		var toggle = item.firstElementChild;
		if (
			!toggle ||
			toggle.tagName !== 'A' ||
			toggle.getAttribute('href') !== 'javascript:void(0)'
		) {
			return null;
		}
		return toggle;
	}

	function navTreeItemCollapsed(item) {
		var toggle = navTreeExpandToggle(item);
		if (!toggle) return false;
		var arrowhead = toggle.querySelector('.arrowhead');
		return Boolean(arrowhead && arrowhead.classList.contains('closed'));
	}

	function expandNavTreeItemIfCollapsed(item) {
		var toggle = navTreeExpandToggle(item);
		if (!toggle) return;
		if (navTreeItemCollapsed(item)) toggle.click();
	}

	function expandNavTreeAncestors(item) {
		var li = item.closest('li');
		if (!li) return;
		var ancestors = [];
		var ul = li.parentElement;
		while (ul && ul.id !== 'nav-tree-contents') {
			var parentLi = ul.parentElement;
			if (!parentLi || parentLi.tagName !== 'LI') break;
			var parentItem = parentLi.querySelector(':scope > div.item');
			if (parentItem) ancestors.push(parentItem);
			ul = parentLi.parentElement;
		}
		ancestors.forEach(expandNavTreeItemIfCollapsed);
	}

	function scheduleExpandSelectedNavTreeItem(force) {
		if (navTreeExpandTimer) clearTimeout(navTreeExpandTimer);
		var attempts = 0;
		var ancestorsDone = false;

		function tryExpand() {
			var selected = document.querySelector(
				'#nav-tree .item#selected, #nav-tree .item.selected'
			);
			if (!selected) {
				if (++attempts < 60) {
					navTreeExpandTimer = setTimeout(tryExpand, 100);
				}
				return;
			}

			var key = selectedNavTreeKey(selected);
			if (
				!force &&
				navTreeUserCollapsedSelected &&
				key === navTreeAutoExpandKey
			) {
				return;
			}
			if (!force && key === navTreeAutoExpandKey && !navTreeItemCollapsed(selected)) {
				return;
			}

			if (!ancestorsDone) {
				expandNavTreeAncestors(selected);
				ancestorsDone = true;
			}
			if (!navTreeUserCollapsedSelected || force) {
				expandNavTreeItemIfCollapsed(selected);
			}
			if (!navTreeItemCollapsed(selected)) {
				navTreeAutoExpandKey = key;
				navTreeUserCollapsedSelected = false;
				return;
			}
			if (!navTreeUserCollapsedSelected && ++attempts < 60) {
				navTreeExpandTimer = setTimeout(tryExpand, 100);
			}
		}

		navTreeExpandTimer = setTimeout(tryExpand, 0);
	}

	function initNavTreeExpandOnLinkClick() {
		var navTree = document.getElementById('nav-tree');
		if (!navTree) return;

		navTree.addEventListener('click', function (e) {
			var toggleLink = e.target.closest &&
				e.target.closest('#nav-tree .item > a[href="javascript:void(0)"]');
			if (toggleLink) {
				var arrowhead = toggleLink.querySelector('.arrowhead');
				if (arrowhead && arrowhead.classList.contains('opened')) {
					var item = toggleLink.parentElement;
					var selected = document.querySelector(
						'#nav-tree .item#selected, #nav-tree .item.selected'
					);
					if (item && item === selected) {
						navTreeUserCollapsedSelected = true;
						navTreeAutoExpandKey = selectedNavTreeKey(selected);
						if (navTreeExpandTimer) clearTimeout(navTreeExpandTimer);
					}
				}
				return;
			}

			var labelLink = e.target.closest && e.target.closest('#nav-tree .label a');
			if (!labelLink || labelLink.classList.contains('nolink')) return;

			var item = labelLink.closest('.item');
			if (!item) return;

			navTreeUserCollapsedSelected = false;
			navTreeAutoExpandKey = '';
			expandNavTreeAncestors(item);
			expandNavTreeItemIfCollapsed(item);
			scheduleExpandSelectedNavTreeItem(true);
		}, true);

		window.addEventListener('load', function () {
			navTreeUserCollapsedSelected = false;
			scheduleExpandSelectedNavTreeItem(false);
		});
		window.addEventListener('hashchange', function () {
			navTreeUserCollapsedSelected = false;
			navTreeAutoExpandKey = '';
			scheduleExpandSelectedNavTreeItem(false);
		});

		scheduleExpandSelectedNavTreeItem(false);
	}

	// ---------------------------------------------------------------------------
	// Boot
	// ---------------------------------------------------------------------------

	function init() {
		applyMemberDeclColumnWidths();
		applyMemprotoReturnNameSplit();
		applyTgenCppHighlights();
		applyFragmentCppTokenHighlights();
		highlightAllMemItemLeft();
		highlightAllMemItemRight();

		var root = docContent();
		if (root) {
			applyDocLinkRedirects(root);
			registerPostLoadLinkStripping(root);
		}

		removeEmptyParameterCells();
		injectProjectHeader();
		initNavTreeExpandOnLinkClick();
	}

	document.addEventListener('DOMContentLoaded', init);
})();
</script>
