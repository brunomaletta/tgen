name: tgen

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  gtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y g++ libgtest-dev cmake

      - name: Build gtest (required on Ubuntu)
        run: |
          cd /usr/src/googletest
          sudo cmake .
          sudo make
          sudo cp lib/libgtest*.a /usr/lib/

      - name: Compile tests
        run: |
          g++ -std=c++17 tests/*.cpp -lgtest -lgtest_main -pthread -I src -o tests_runner

      - name: Run tests
        run: |
          ./tests_runner

  deploy:
    needs: gtest
    runs-on: ubuntu-latest
  
    permissions:
      pages: write
      id-token: write
      contents: read
  
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # IMPORTANT (you use doxygen-awesome as submodule)
  
      - name: Install doxygen
        run: |
          sudo apt update
          sudo apt install -y doxygen graphviz make
  
      - name: Build documentation
        run: make doc
  
      # Pages requires this file to exist
      - name: Setup Pages
        uses: actions/configure-pages@v5
  
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/html
  
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
