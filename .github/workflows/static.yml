name: Tests + Docs + Deploy

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # -------------------- TESTS --------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler and gtest
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make cmake libgtest-dev
      
          # Build gtest (Ubuntu provides sources only)
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib

      - name: Run tests (same as local)
        run: make test


  # -------------------- DOCS --------------------
  build-docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # clang parser dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev graphviz wget

      # exact doxygen version (matches local)
      - name: Install Doxygen 1.14.0
        run: |
          set -e
          DOXYGEN_VERSION=1.14.0
          FILE=doxygen-${DOXYGEN_VERSION}.linux.x64.bin.tar.gz
          URL=https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION}/${FILE}
      
          echo "Downloading $URL"
          wget -q --show-progress $URL
          tar -xf $FILE
          sudo mv doxygen-${DOXYGEN_VERSION}/bin/doxygen /usr/local/bin/
          doxygen --version

      - name: Build documentation
        run: make doc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build


  # -------------------- DEPLOY --------------------
  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
