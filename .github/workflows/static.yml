name: Lint + Tests + Docs + Deploy

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # -------------------- CHECKS CHANGES --------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tests:
              - 'single_include/**'
              - 'tests/**'
              - 'examples/**'
            docs:
              - 'docs/**'

  # -------------------- LINT + TESTS --------------------
  test:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compiler and gtest
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make cmake libgtest-dev
      
          # Build gtest (Ubuntu provides sources only)
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib

      - name: Check formatting
        run: make lint-check

      - name: Run tests
        run: make test


  # -------------------- DOCS --------------------
  build-docs:
    needs: changes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.docs == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # clang parser dependencies
      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y \
            graphviz \
            make \
            clang \
            libc++-dev \
            libc++abi-dev

      # exact doxygen version (matches local)
      - name: Install Doxygen 1.14.0
        run: |
          set -e
          DOXYGEN_VERSION=1.14.0
          URL=https://github.com/doxygen/doxygen/releases/download/Release_1_14_0/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz
       
          echo "Downloading $URL"
          curl -L $URL -o doxygen.tar.gz
       
          tar -xf doxygen.tar.gz
          sudo mv doxygen-${DOXYGEN_VERSION}/bin/doxygen /usr/local/bin/
       
          doxygen --version

      - name: Build documentation
        run: make doc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build


  # -------------------- DEPLOY --------------------
  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
