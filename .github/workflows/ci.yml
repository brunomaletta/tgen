name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compiler and gtest
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang make cmake libgtest-dev

          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib

      - name: Check formatting
        run: make lint-check

      - name: Run tests GCC
        run: make test

      - name: Run tests Clang
        run: make test_clang
