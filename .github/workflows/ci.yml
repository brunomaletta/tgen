name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler and gtest
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang make cmake libgtest-dev

          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib

      - name: Check formatting
        run: make lint-check

      - name: Run tests GCC
        run: make test

      - name: Run tests Clang
        run: make test_clang

      - name: Run tests ASan
        run: make test_asan

      - name: Benchmark smoke and regression check
        run: make benchmark-check

      - name: Test doc scripts
        run: cd docs && python3 -m unittest test_llms_gen test_benchmark_render test_benchmark_check -v
